<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literary Network Database</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Liberation Sans', Arial, sans-serif; background: #e8f4fd; padding: 30px; color: #1a3a5c; }
h1 { text-align: center; margin-bottom: 25px; color: #2c5f8a; font-size: 1.6em; }
.filters { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(44,95,138,0.1); display: flex; flex-wrap: wrap; gap: 30px; align-items: center; }
.filter-group { display: flex; flex-direction: column; gap: 8px; }
.filter-group label { font-weight: bold; font-size: 0.9em; color: #2c5f8a; }
.filter-group input[type="text"] { padding: 10px 14px; border: 2px solid #b8d9f0; border-radius: 8px; font-size: 0.95em; outline: none; transition: border-color 0.2s; width: 220px; }
.filter-group input[type="text"]:focus { border-color: #5ba3d9; }
.slider-container { position: relative; width: 280px; height: 40px; }
.slider-track { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; height: 6px; background: #d0e8f7; border-radius: 3px; }
.slider-range { position: absolute; top: 50%; transform: translateY(-50%); height: 6px; background: #5ba3d9; border-radius: 3px; }
.slider-container input[type="range"] { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; height: 6px; -webkit-appearance: none; appearance: none; background: transparent; pointer-events: none; outline: none; margin: 0; }
.slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #4a9bd9; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(74,155,217,0.4); cursor: pointer; pointer-events: all; position: relative; z-index: 2; }
.slider-container input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #4a9bd9; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(74,155,217,0.4); cursor: pointer; pointer-events: all; position: relative; z-index: 2; }
.slider-values { display: flex; justify-content: space-between; font-size: 0.85em; color: #4a7fa8; margin-top: 4px; }
.slider-values span { background: #dceefb; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
.table-container { background: #fff; border-radius: 12px; overflow: auto; max-height: 70vh; box-shadow: 0 2px 12px rgba(44,95,138,0.1); }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
thead { position: sticky; top: 0; z-index: 1; }
th { background: #4a9bd9; color: #fff; padding: 12px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid #e3f0fa; }
tr:nth-child(even) { background: #f0f8ff; }
tr:hover { background: #dceefb; }
.row-count { text-align: center; margin-top: 12px; font-size: 0.9em; color: #5a8ab5; }
.msg { text-align: center; padding: 20px; }
pre { text-align: left; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Sociabilités et réseaux littéraires — Annexe</h1>

<div class="filters">
    <div class="filter-group">
    <label for="numFilter">Numéro (exact)</label>
    <input type="text" id="numFilter" placeholder="e.g. 796" inputmode="numeric">
  </div>
  <div class="filter-group">
    <label for="nameFilter">Filter by Nom</label>
    <input type="text" id="nameFilter" placeholder="Type a name...">
  </div>
  <div class="filter-group">
    <label>Année de naissance</label>
    <div class="slider-container">
      <div class="slider-track"></div>
      <div class="slider-range" id="sliderRange"></div>
      <input type="range" id="minYear" min="1850" max="1930" value="1850" step="1">
      <input type="range" id="maxYear" min="1850" max="1930" value="1930" step="1">
    </div>
    <div class="slider-values">
      <span id="minLabel">1850</span>
      <span id="maxLabel">1930</span>
    </div>
  </div>
</div>

<div class="table-container">
  <table id="dataTable">
    <thead>
      <tr>
        <th>Numéro</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Année_Naissance</th>
        <th>Année_Décès</th>
        <th>Nombre_d_institutions</th>
        <th>Nrm_Degree</th>
        <th>Farness_Main_Component</th>
        <th>n_Closeness_Main_Component</th>
        <th>Betweenness_Main_Component</th>
        <th>n_Betweenness</th>
        <th>Bonacich_Power</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="row-count" id="rowCount"></div>

<script>
// Relative path: works on GitHub Pages and localhost when person.csv sits next to this file.
// If the CSV stays on another server, put the full URL here (server must send CORS headers).
const CSV_URL = 'person.csv';

const MIN_Y = 1850, MAX_Y = 1930;
let allData = [];
let nameIdx = 1, birthIdx = 3;

const nameFilter  = document.getElementById('nameFilter');
const minSlider   = document.getElementById('minYear');
const maxSlider   = document.getElementById('maxYear');
const sliderRange = document.getElementById('sliderRange');
const minLabel    = document.getElementById('minLabel');
const maxLabel    = document.getElementById('maxLabel');
const tbody       = document.getElementById('tableBody');
const rowCount    = document.getElementById('rowCount');
const numFilter = document.getElementById('numFilter');
let numIdx = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showMessage(html) {
  tbody.innerHTML = '<tr><td colspan="12" class="msg">' + html + '</td></tr>';
}

fetch(CSV_URL)
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + CSV_URL);
    return r.text();
  })
  .then(csv => {
    allData = parseCSV(csv);
    if (!allData.length) {
      showMessage('No rows parsed. First 300 characters received:<pre>' + esc(csv.slice(0, 300)) + '</pre>');
      return;
    }
    applyFilters();
  })
  .catch(err => {
    console.error(err);
    showMessage('Could not load data: ' + esc(err.message) +
      '<br>Check the file name (case-sensitive), that it is served over http(s), and CORS if it is on another domain.');
  });

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');                       // strip BOM
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];

  const head = lines[0];
  const count = ch => head.split(ch).length - 1;
  const delim = ['\t', ',', ';'].sort((a, b) => count(b) - count(a))[0];

  const header = parseCSVLine(head, delim).map(s => s.toLowerCase());
  const find = (re, fallback) => {
    const i = header.findIndex(h => re.test(h));
    return i >= 0 ? i : fallback;
  };
  nameIdx  = find(/^nom$/, 1);
  birthIdx = find(/naissance/, 3);
  numIdx = find(/^num/, 0);
  console.log('delimiter:', JSON.stringify(delim), '| columns:', header.length, header);

  return lines.slice(1)
    .map(l => parseCSVLine(l, delim))
    .filter(r => r.length > 1);
}

function parseCSVLine(line, delim) {
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (q && line[i + 1] === '"') { cur += '"'; i++; }
      else q = !q;
    } else if (ch === delim && !q) {
      out.push(cur.trim());
      cur = '';
    } else {
      cur += ch;
    }
  }
  out.push(cur.trim());
  return out;
}

function applyFilters() {
  const nameVal = nameFilter.value.toLowerCase();
  const numVal = numFilter.value.trim();
  const lo = parseInt(minSlider.value), hi = parseInt(maxSlider.value);
  const fullRange = lo === MIN_Y && hi === MAX_Y;

  const filtered = allData.filter(row => {
    const numMatch = !numVal || (row[numIdx] || '').trim() === numVal;   // identical only
    const nameMatch = !nameVal || (row[nameIdx] || '').toLowerCase().includes(nameVal);
    const birth = parseInt(row[birthIdx]);
    const yearMatch = fullRange || (!isNaN(birth) && birth >= lo && birth <= hi);
    return numMatch && nameMatch && yearMatch;
  });

  tbody.innerHTML = filtered.map(row =>
    '<tr>' + row.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>'
  ).join('');
  rowCount.textContent = filtered.length + ' of ' + allData.length + ' rows shown';
}

numFilter.addEventListener('input', applyFilters);

function updateSlider() {
  let lo = parseInt(minSlider.value), hi = parseInt(maxSlider.value);
  if (lo > hi) {
    [minSlider.value, maxSlider.value] = [hi, lo];
    [lo, hi] = [hi, lo];
  }
  const range = MAX_Y - MIN_Y;
  const left  = ((lo - MIN_Y) / range) * 100;
  const right = ((hi - MIN_Y) / range) * 100;
  sliderRange.style.left  = left + '%';
  sliderRange.style.width = (right - left) + '%';
  minLabel.textContent = lo;
  maxLabel.textContent = hi;
  applyFilters();
}

nameFilter.addEventListener('input', applyFilters);
minSlider.addEventListener('input', updateSlider);
maxSlider.addEventListener('input', updateSlider);
updateSlider();
</script>

</body>
</html>
