<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Population — Sociabilités et réseaux littéraires</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Sociabilités et réseaux littéraires — Population</h1>
<nav><a href="population.html"><b>Population</b></a><a href="distributions.html">Distributions</a><a href="correlations.html">Corrélations</a></nav>

<div class="status">
  <span><b id="count"></b> <button id="reset">Réinitialiser filtres et tris</button></span>
  <span class="hint">Tri : clic sur un titre, <b>Maj+clic</b> pour cumuler (▲ → ▼ → retiré).
    Filtres numériques : <code>&gt;1900</code>, <code>&lt;=3.5</code>, <code>&gt;10 &lt;20</code>, ou une valeur seule (égalité).</span>
</div>

<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

<div class="status">
  <label style="flex-direction:row;align-items:center;gap:.4rem">Lignes par page
    <select id="pageSize"><option>50</option><option selected>100</option><option>250</option><option value="1e9">Toutes</option></select></label>
  <span><button id="prev">←</button> <span id="pageInfo"></span> <button id="next">→</button></span>
</div>
<p class="hint" id="msg"></p>

<script>
const CSV_URL = 'person.csv';
const COLS = [
  {key:'numero',   label:'Numéro',                   num:true},
  {key:'name',     label:'Nom, Prénom',              num:false},
  {key:'annee_naissance', label:'Année_Naissance',   num:true, zeroNull:true},
  {key:'annee_deces',     label:'Année_Décès',       num:true, zeroNull:true},
  {key:'nombre_d_institutions', label:'Nombre_d_institutions', num:true},
  {key:'nrm_degree', label:'Nrm_Degree', num:true},
  {key:'farness_main_component', label:'Farness_Main_Component', num:true},
  {key:'n_closeness_main_component', label:'n_Closeness_Main_Component', num:true},
  {key:'betweenness_main_component', label:'Betweenness_Main_Component', num:true},
  {key:'n_betweenness', label:'n_Betweenness', num:true},
  {key:'bonacich_power', label:'Bonacich_Power', num:true},
];
const $ = id => document.getElementById(id);
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const first = text.split(/\r?\n/,1)[0];
  const d = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===d){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

let DATA=[], FULL={}, view=[], sorts=[], page=0;
const filters = {};   // key -> {conds:[{op,v}]} for numbers, {text} for name

/* "<5", ">=1900", ">10 <20", "42" -> conditions ; null = empty ; false = invalid */
function parseNumFilter(str){
  str = str.trim();
  if(!str) return null;
  const re = /\s*(<=|>=|<|>|=)?\s*(-?\d+(?:[.,]\d+)?)\s*/y;
  const conds = []; let m;
  while(re.lastIndex < str.length && (m = re.exec(str))){
    conds.push({op:m[1]||'=', v:parseFloat(m[2].replace(',','.'))});
  }
  return (conds.length && re.lastIndex >= str.length) ? conds : false;
}
const OPS = {'<':(a,b)=>a<b,'<=':(a,b)=>a<=b,'>':(a,b)=>a>b,'>=':(a,b)=>a>=b,'=':(a,b)=>a===b};

function build(rows){
  const head = rows[0].map(norm);
  const idx = k => head.indexOf(k);
  const num = v => { if(v==null||v.trim()==='') return null; const x=parseFloat(v.replace(',','.')); return isNaN(x)?null:x; };
  DATA = rows.slice(1).map(r=>{
    const o = {};
    for(const c of COLS){
      if(c.key==='name') continue;
      o[c.key] = num(r[idx(c.key)]);
      if(c.zeroNull && o[c.key]===0) o[c.key]=null;
    }
    const nom=(r[idx('nom')]||'').trim(), pre=(r[idx('prenom')]||'').trim();
    o.name = [nom,pre].filter(Boolean).join(', ');
    o._s = norm(o.name).replace(/_/g,' ');
    return o;
  });
  for(const c of COLS.filter(c=>c.num)){
    const v = DATA.map(d=>d[c.key]).filter(x=>x!=null);
    FULL[c.key] = {min:Math.min(...v), max:Math.max(...v)};
  }
  initUI();
}

const fmt = v => v==null ? '—' : (Number.isInteger(v) ? String(v) : (+v.toFixed(3)).toString());

function initUI(){
  $('thead').innerHTML =
    '<tr class="labels">'+COLS.map(c=>`<th class="${c.num?'n':''}" data-k="${c.key}">${c.label}<span class="sortmark"></span></th>`).join('')+'</tr>'+
    '<tr class="filters">'+COLS.map(c=>{
      const f = FULL[c.key];
      return `<th>${c.num
        ? `<input type="text" data-k="${c.key}" data-num="1" placeholder="&lt;v  &gt;v" title="${fmt(f.min)} … ${fmt(f.max)}" style="text-align:right">`
        : `<input type="text" data-k="${c.key}" placeholder="filtrer…">`}</th>`;
    }).join('')+'</tr>';
  $('thead').querySelector('.labels').onclick = e => { const th=e.target.closest('th'); if(th) toggleSort(th.dataset.k, e.shiftKey); };
  $('thead').querySelector('.filters').oninput = e => {
    const t=e.target, k=t.dataset.k; if(!k) return;
    if(t.dataset.num){
      const p = parseNumFilter(t.value);
      t.classList.toggle('bad', p===false);
      if(p) filters[k]={conds:p}; else delete filters[k];      // invalid or empty -> no filter
    } else {
      const s = norm(t.value).replace(/_/g,' ');
      if(s) filters[k]={text:s}; else delete filters[k];
    }
    page=0; update();
  };
  $('pageSize').onchange = () => { page=0; update(); };
  $('prev').onclick = () => { if(page>0){page--; render();} };
  $('next').onclick = () => { page++; render(); };
  $('reset').onclick = () => {
    document.querySelectorAll('tr.filters input').forEach(i=>{i.value='';i.classList.remove('bad');});
    for(const k in filters) delete filters[k];
    sorts=[]; page=0; update();
  };
  update();
}

function toggleSort(k, multi){
  const i = sorts.findIndex(s=>s.key===k);
  if(!multi){
    sorts = (sorts.length===1 && i===0) ? [{key:k, dir:-sorts[0].dir}] : [{key:k, dir:1}];
  } else if(i<0) sorts.push({key:k, dir:1});
  else if(sorts[i].dir===1) sorts[i].dir=-1;
  else sorts.splice(i,1);
  update();
}

function update(){
  const keys = Object.keys(filters);
  view = DATA.filter(d=>{
    for(const k of keys){
      const f=filters[k];
      if(f.text){ if(!d._s.includes(f.text)) return false; }
      else {
        const v=d[k];
        if(v==null) return false;
        for(const c of f.conds) if(!OPS[c.op](v,c.v)) return false;
      }
    }
    return true;
  });
  if(sorts.length) view.sort((a,b)=>{
    for(const s of sorts){
      const x=a[s.key], y=b[s.key];
      if(x==null && y==null) continue;
      if(x==null) return 1; if(y==null) return -1;          // empty values always last
      const c = typeof x==='string' ? x.localeCompare(y,'fr') : x-y;
      if(c) return c*s.dir;
    }
    return 0;
  });
  document.querySelectorAll('tr.labels th').forEach(th=>{
    const i=sorts.findIndex(s=>s.key===th.dataset.k);
    th.querySelector('.sortmark').textContent = i<0 ? '' : (sorts[i].dir===1?'▲':'▼') + (sorts.length>1?(i+1):'');
  });
  render();
}

function render(){
  const ps = parseFloat($('pageSize').value);
  const pages = Math.max(1, Math.ceil(view.length/ps));
  page = Math.min(page, pages-1);
  const slice = view.slice(page*ps, page*ps+ps);
  $('tbody').innerHTML = slice.map(d=>'<tr>'+COLS.map(c=>
    `<td class="${c.num?'n':''}">${c.num ? fmt(d[c.key]) : esc(d[c.key])}</td>`).join('')+'</tr>').join('');
  $('count').textContent = `${view.length} / ${DATA.length} personnes`;
  $('pageInfo').textContent = `${page+1} / ${pages}`;
  $('prev').disabled = page===0; $('next').disabled = page>=pages-1;
}

fetch(CSV_URL).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(t=>build(parseCSV(t)))
  .catch(()=>{
    $('msg').innerHTML = `<span class="err">Impossible de charger ${CSV_URL} (ouvrez via un serveur http, ou choisissez le fichier) :</span> <input type="file" id="file" accept=".csv,.tsv,.txt">`;
    $('file').onchange = e => e.target.files[0].text().then(t=>{ $('msg').textContent=''; build(parseCSV(t)); });
  });
</script>
</body>
</html>
